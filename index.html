<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>見守りMAP</title>

<!-- M PLUS Rounded 1c フォントの読み込み -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<style>
body{
    margin:0;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    color: #2B1C0B; /* 全体の文字色 */
    background:#FFF8EB;
}

/* 両サイドの余白設定 */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 8px;
    box-sizing: border-box;
}

h1{
    text-align:center;
    margin:10px;
}

#map{
    width:100%;
    height:70vh;
}

#info{
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:15px;
    background:white;
    margin-top: 10px;
    border: 2px solid #2B1C0B; /* 枠線を文字色と統一 */
    border-radius: 12px;        /* 角丸で柔らかいデザインに */
}

.item{
    text-align:center;
}

.item img{
    width:60px;
    height:auto;
}

#distance{
    font-size:24px;
    font-weight: bold;
    color: #2B1C0B;
}

#battery{
    font-size:20px;
    font-weight: bold;
    color: #2B1C0B;
}

/* Leaflet用のカスタムマーカースタイル */
.custom-pin {
    width: 32px;
    height: 32px;
    border-radius: 50% 50% 50% 0;
    position: absolute;
    transform: rotate(-45deg);
    left: 50%;
    top: 50%;
    margin: -20px 0 0 -20px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
}

.custom-pin-content {
    transform: rotate(45deg);
    font-weight: bold;
    font-size: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* HOMEピンのスタイル */
.home-pin {
    background: #FFFFFF;
    border: 2px solid #2B1C0B;
}

.home-pin img {
    width: 20px;
    height: 20px;
    object-fit: contain;
}

/* Aちゃんピンのスタイル */
.a-pin {
    background: #4285F4;
    border: 2px solid #FFFFFF;
    color: #FFFFFF;
}
</style>
</head>
<body>

<div class="container">

<h1>見守りMAP</h1>

<div id="map"></div>

<div id="info">

    <div class="item">
        <div style="font-size:40px;">📏</div>
        <div id="distance">0 m</div>
    </div>

    <div class="item">
        <img id="batteryIcon" src="battry-high.png" alt="battery">
        <div id="battery">100%</div>
    </div>

</div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
let map;
let gpsMarker;
let trackLine; // 軌跡用のPolylineオブジェクト
const pathCoordinates = []; // 走行位置履歴の配列

const home = {
    lat: 35.645000,
    lng: 139.891667
};

// 東向き（約5mごと）の座標リスト（基準0m + 5点＝計6点）
const routePoints = [
    { lat: 35.636667, lng: 139.881667 }, // 0m
    { lat: 35.636670, lng: 139.881722 }, // 5m
    { lat: 35.636673, lng: 139.881777 }, // 10m
    { lat: 35.636676, lng: 139.881832 }, // 15m
    { lat: 35.636679, lng: 139.881888 }, // 20m
    { lat: 35.636682, lng: 139.881943 }  // 25m
];

function initMap(){
    // 地図の初期化（基準位置付近を中心に表示）
    map = L.map('map').setView([routePoints[0].lat, routePoints[0].lng], 18);

    // OpenStreetMapのタイルを追加
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // 軌跡を描画するPolylineを青色で追加
    trackLine = L.polyline([], { color: '#4285F4', weight: 4, opacity: 0.8 }).addTo(map);

    // 1. 家アイコン（HTML/CSSによるカスタムDIVアイコン）
    const homeIconHtml = `
        <div class="custom-pin home-pin">
            <div class="custom-pin-content">
                <img src="home.png" alt="HOME">
            </div>
        </div>
    `;
    
    const homeIcon = L.divIcon({
        className: '',
        html: homeIconHtml,
        iconSize: [32, 32],
        iconAnchor: [16, 32]
    });

    L.marker([home.lat, home.lng], { icon: homeIcon, title: "HOME" }).addTo(map);

    // 2. Aちゃんアイコン
    const aIconHtml = `
        <div class="custom-pin a-pin">
            <div class="custom-pin-content">A</div>
        </div>
    `;

    const aIcon = L.divIcon({
        className: '',
        html: aIconHtml,
        iconSize: [32, 32],
        iconAnchor: [16, 32]
    });

    gpsMarker = L.marker([routePoints[0].lat, routePoints[0].lng], { icon: aIcon, title: "Aちゃん" }).addTo(map);

    // テスト用バッテリー表示（20%）
    updateBattery(20);

    // 5秒おきに座標を順次入力するアニメーションを開始
    startGPSAnimation();
}

function startGPSAnimation() {
    let index = 0;

    // 最初の地点を処理
    sendPoint(index);

    // 5000ミリ秒（5秒）毎に次の座標へ更新
    const timer = setInterval(() => {
        index++;
        if (index < routePoints.length) {
            sendPoint(index);
        } else {
            clearInterval(timer); // 全データ入力完了時にタイマー停止
        }
    }, 5000);
}

function sendPoint(i) {
    const pt = routePoints[i];
    const ggaSentence = decimalToNMEA(pt.lat, pt.lng);
    updateFromGGA(ggaSentence);
}

/**
 * 10進数座標(lat, lng)を $GNGGA フォーマット文字列に変換する関数
 */
function decimalToNMEA(lat, lng) {
    const latAbs = Math.abs(lat);
    const latDeg = Math.floor(latAbs);
    const latMin = (latAbs - latDeg) * 60;
    const latDir = lat >= 0 ? "N" : "S";
    const latStr = String(latDeg).padStart(2, '0') + latMin.toFixed(4).padStart(7, '0');

    const lngAbs = Math.abs(lng);
    const lngDeg = Math.floor(lngAbs);
    const lngMin = (lngAbs - lngDeg) * 60;
    const lngDir = lng >= 0 ? "E" : "W";
    const lngStr = String(lngDeg).padStart(3, '0') + lngMin.toFixed(4).padStart(7, '0');

    return `$GNGGA,000000.00,${latStr},${latDir},${lngStr},${lngDir},1,12,0.8,0.0,M,0.0,M,,`;
}

function nmeaToDecimal(value,direction){
    const degLength = (direction==="N" || direction==="S") ? 2 : 3;
    const degrees = parseFloat(value.substring(0,degLength));
    const minutes = parseFloat(value.substring(degLength));

    let decimal = degrees + minutes/60;
    if(direction==="S" || direction==="W"){
        decimal *= -1;
    }
    return decimal;
}

function updateFromGGA(gga){
    const d = gga.split(",");
    if (d.length < 6) return;

    const lat = nmeaToDecimal(d[2],d[3]);
    const lng = nmeaToDecimal(d[4],d[5]);

    // 1. ピンの位置を更新
    if (gpsMarker) {
        gpsMarker.setLatLng([lat, lng]);
    }

    // 2. 軌跡データを追加・更新
    pathCoordinates.push([lat, lng]);
    if (trackLine) {
        trackLine.setLatLngs(pathCoordinates);
    }

    // 3. マップの中心を移動中のピンに追従
    if (map) {
        map.panTo([lat, lng]);
    }

    // 4. HOMEからの距離を計算
    const distance = getDistance(
        home.lat,
        home.lng,
        lat,
        lng
    );

    document.getElementById("distance").innerText = Math.round(distance) + " m";
}

function updateBattery(level){
    document.getElementById("battery").innerText = level + "%";

    const icon = document.getElementById("batteryIcon");
    if(!icon) return;

    if(level >= 66){
        icon.src = "battry-high.png";   // 66%〜100%
    }else if(level >= 21){
        icon.src = "battry-mdium.png";  // 21%〜65%
    }else{
        icon.src = "battry-low.png";    // 20%以下
    }
}

function getDistance(lat1,lon1,lat2,lon2){
    const R = 6371000;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLon = (lon2-lon1)*Math.PI/180;

    const a =
        Math.sin(dLat/2)*Math.sin(dLat/2) +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)*Math.sin(dLon/2);

    const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R*c;
}

// ページ読み込み完了時にマップを初期化
window.onload = initMap;
</script>

</body>
</html>
