name = "hakkasn"
main = "src/index.js"
compatibility_date = "2024-01-01"

[assets]
directory = "."
exclude = ["src/**", "wrangler.toml", "node_modules/**", ".git/**"]
# すべてのリクエストを先に Worker スクリプト(index.js)へ回す設定
run_worker_first = true

[observability]
enabled = true

[observability.logs]
enabled = true
