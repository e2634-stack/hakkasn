<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>見守りMAP</title>

<style>
    body{
        margin:0;
        font-family:sans-serif;
    }

    h1{
        text-align:center;
    }

    #map{
        width:100%;
        height:70vh;
    }

    #panel{
        display:flex;
        justify-content:space-around;
        padding:15px;
        font-size:22px;
    }

    .card{
        text-align:center;
    }
</style>
</head>

<body>

<h1>見守りMAP</h1>

<div id="map"></div>

<div id="panel">

    <div class="card">
        ☂<br>
        晴れ
    </div>

    <div class="card">
        📏<br>
        <span id="distance">-- m</span>
    </div>

    <div class="card">
        🔋<br>
        <span id="battery">100%</span>
    </div>

</div>

<script>
let map;
let gpsMarker;

// ご提示いただいたGGA電文を解析した結果の「家」の座標
// 緯度: 35度 38.7000分 (N) -> 35 + (38.7 / 60) = 35.645
// 経度: 139度 53.5000分 (E) -> 139 + (53.5 / 60) = 139.891667
const home = {
    lat: 35.645,
    lng: 139.891667
};

function initMap(){
    map = new google.maps.Map(
        document.getElementById("map"),
        {
            zoom:17,
            center:home
        }
    );

    new google.maps.Marker({
        position:home,
        map:map,
        label:"家"
    });

    // 初期状態では「家」と同じ位置にマーカーAを配置
    gpsMarker = new google.maps.Marker({
        position:home,
        map:map,
        label:"A"
    });
}

function nmeaToDecimal(value, direction){
    const degLength =
    (direction==="N" || direction==="S")
    ? 2
    : 3;

    const degrees =
    parseFloat(value.substring(0,degLength));

    const minutes =
    parseFloat(value.substring(degLength));

    let result =
    degrees + minutes/60;

    if(direction==="S" || direction==="W"){
        result *= -1;
    }

    return result;
}

function updateFromGGA(gga){
    const data = gga.split(",");

    const lat =
    nmeaToDecimal(data[2],data[3]);

    const lng =
    nmeaToDecimal(data[4],data[5]);

    const pos = {
        lat:lat,
        lng:lng
    };

    gpsMarker.setPosition(pos);

    map.panTo(pos);

    const distance =
    getDistance(
        home.lat,
        home.lng,
        lat,
        lng
    );

    document.getElementById("distance")
        .innerText =
        Math.round(distance)+" m";
}

function getDistance(lat1,lng1,lat2,lng2){
    const R = 6371000;

    const dLat =
    (lat2-lat1) * Math.PI/180;

    const dLng =
    (lng2-lng1) * Math.PI/180;

    const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLng/2)**2;

    return R *
    2 *
    Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );
}
</script>

<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVLN_FmTPYJeawf-qtg9Z69ObbLoI5k74&callback=initMap">
</script>

</body>
</html>
